name: Clarity

bottomRowHeightMode: Flexible

numberRowMode: AlwaysDisabled

description: Vowel Vortex layout


overrideWidths:
  Custom1: 0.1428        # Consonants
  Custom2: 0.11          # ' and ,
  Custom3: 0.08          # gaps
  Custom4: 0.1758        # Vowels
  FunctionalKey: 0.20    # function key

rows:

  - letters: [
  
      {type: base, spec: 'q',
      hint: "¹", 
      attributes: { 
      width: Custom1, 
      style: Normal }, 
      moreKeys: [
      "!fixedColumnOrder!6", 
      1, "~", "\u0022", "?", ‽, ¿,
      ¹, ₁, ½, ⅓, ¼, ⅕, 
      ⅙, ⅐, ⅛, ⅑, ⅒ ]},
      
      
      {type: base, spec: 'w', 
      hint: " ", 
      attributes: { 
      width: Custom1, 
      style: Normal }, 
      moreKeys: [
      "!fixedColumnOrder!6", 
      2, "`", ², ₂, ⅔, ⅖]},
      
      
      {type: base, spec: 'r', 
      hint: " ", 
      attributes: { 
      width: Custom1, 
      style: Normal }, 
      moreKeys: [
      "!autoColumnOrder!7", 
      3, ³, ₃, ¾, ⅗, ⅜, "•" ]},
      
      
      {type: base, spec: 't', 
      hint: "⁴", 
      attributes: { 
      width: Custom1, 
      style: Normal }, 
      moreKeys: [
      "!fixedColumnOrder!6", 
      ₄, ⁴, 4, "`", "~", "×"]},
      
      
      {type: base, spec: 'y', 
      hint: " ", 
      attributes: { 
      width: Custom1, 
      style: Normal }, 
      moreKeys: [
      "!autoColumnOrder!7", 
      5,
      "!icon/action_redo|!code/action_redo", 
      ⁵, "π", ₅, ⅚, ⅝ ]},
      
      
      {type: base, spec: 'p', 
      hint: " ", 
      attributes: { 
      width: Custom1, 
      style: Normal }, 
      moreKeys: [
      "!autoColumnOrder!7", 
      6,
      "!icon/numpad|
      !code/key_to_number_layout", 
      "|", "%|%", "π", "=", "#", 
      ⁶, ₆, "+", "±", "₊", "⁺" ]},
      
      
      {type: base, spec: 'l', 
      hint: "⁷", 
      attributes: { 
      width: Custom1, 
      style: Normal }, 
      moreKeys: [
      "!autoColumnOrder!7", 
      7, ⁷, ₇, ⅞, 
      ")", "]", "⟩", 
      "}", "\\", "|", ">", "≥", "›", "»" ]}
    ]
  
  
  - letters: [
  
      {type: base, spec: 'a', 
      hint: " ", 
      attributes: { width: Custom1 }, 
      moreKeys: [
      "!fixedColumnOrder!6", 
      "@", "&", "→", "←", "↑", "↓",
      "!icon/action_select_all|!code/action_select_all", 
      "!icon/tab_key|!code/key_tab", 
      "~", "'", "*" ]},
      
      
      {type: base, spec: ",", 
      attributes: { width: Custom2 }, 
      moreKeys: [
      "!autoColumnOrder!5", 
      "!icon/action_voice_input|
      !code/action_voice_input", 
      "!icon/action_clipboard_history|
      !code/action_clipboard_history", 
      "!icon/action_text_edit|
      !code/action_text_edit", 
      "!icon/numpad|
      !code/key_to_number_layout", 
      "!icon/action_select_all|
      !code/action_select_all", 
      "!icon/action_cut|!code/action_cut", 
      "!icon/action_copy|!code/action_copy", 
      "!icon/action_paste|
      !code/action_paste", 
      "!icon/action_redo|!code/action_redo", 
      "!icon/action_undo|
      !code/action_undo"]},
      
      
      {type: base, spec: 'e', 
      hint: "⁸", 
      attributes: { width: Custom4 }, 
      moreKeys: [
      "!fixedColumnOrder!6", 
      "!icon/action_text_edit|
      !code/action_text_edit", 
      8, ⁸, ₈, "—", "–", 
      "=", "≠", "≈", "…", "![[]]" ]},
      
      
      {type: base, spec: 'u', 
      hint: " ", 
      attributes: { width: Custom1 }, 
      moreKeys: [
      "!autoColumnOrder!5", 
      9, ⁹, ₉, "_" ]},
      
      
      {type: base, spec: 'i', 
      hint: "⁰", 
      attributes: { width: Custom4 },
      moreKeys: [
      "!autoColumnOrder!7", 
      0, ⁰, ₀, "[[]]", "∞", "×"]},
      
      
      {type: base, spec: "'", 
      attributes: { width: Custom2 }, 
      moreKeys: [
      "!autoColumnOrder!7", 
      ".", ",", "/", "\\", "|", ")", "(", 
      "]", "[", "}", "{", ">", "<", "⟨⟩", 
      "()", "{}", "[]", "[]()", "[[]]", 
      "![[]]"]},
      
      
      {type: base, spec: 'o', 
      hint: " ", 
      attributes: { width: Custom1 }, 
      moreKeys: [
      "!autoColumnOrder!6", 
      "°", "•", "Ω", "∅", "ⁿ"]}
      
    ]
  
  
  - letters: [
  
      {type: base, spec: 's', 
      hint: " ", 
      attributes: { width: Custom1 }, 
      moreKeys: [
      "!autoColumnOrder!7", 
      "#", ";", "№", 
      "§", "★", "¶"]},
      
      
      {type: base, spec: 'd', 
      hint: " ", 
      attributes: { width: Custom1 }, 
      moreKeys: [
      "!autoColumnOrder!7", 
      "$", "€", "£", "¢", "¥", "₱", "₹", 
      "°",  "÷", "∆", "†", "‡"]},
      
      
      {type: base, spec: 'f', 
      hint: " ", 
      attributes: { width: Custom1 }, 
      moreKeys: [
      "!autoColumnOrder!3", 
      "_", "%|%"]},
      
      
      {type: base, spec: 'g', 
      hint: " ", 
      attributes: { width: Custom1 }, 
      moreKeys: [
      "!autoColumnOrder!4", 
      "&", "<", ">", "^", 
      "←", "↑", "↓", "→"]},
      
      
      {type: base, spec: 'h', 
      hint: " ", 
      attributes: { width: Custom1 }, 
      moreKeys: [
      "!autoColumnOrder!4", 
      "-", "—", "–"]},
      
      
      {type: base, spec: 'j', 
      hint: " ", 
      attributes: { width: Custom1 }, 
      moreKeys: [
      "!autoColumnOrder!5", 
      "+", "±", "=", "≠", "≈", 
      "∞", "×", "÷", "°", "·"]},
      
      
      {type: base, spec: 'k', 
      hint: " ", 
      attributes: { width: Custom1 }, 
      moreKeys: [
      "!autoColumnOrder!5", 
      "(", "[", "⟨", "{", "/", 
      "|", "<", "≤", "‹", "«"]}
    ]
  
  
  - letters: [
  
      {type: base, spec: 'z', 
      attributes: { width: Custom1 },
      hint: " ", 
      moreKeys: [
      "!autoColumnOrder!6", 
      "*", 
      "!icon/action_undo|!code/action_undo", 
      "★", "†", "‡"]},
      
      
      {type: base, spec: 'x', 
      attributes: { width: Custom1 },
      hint: " ", 
      moreKeys: [
      "!autoColumnOrder!3", 
      "\u0022", 
      "!icon/action_cut|!code/action_cut", 
      "×"]},
      
      
      {type: base, spec: 'c', 
      attributes: { width: Custom1 },
      hint: " ", 
      moreKeys: [
      "!autoColumnOrder!5", 
      "'", ",", 
      "!icon/action_copy|!code/action_copy", 
      "```", 
      '!icon/action_clipboard_history|
      !code/action_clipboard_history', 
      "©", "®", "™", "√" ]},
      
      
      {type: base, spec: 'v', 
      attributes: { width: Custom1 },
      hint: " ", 
      moreKeys: [
      "!autoColumnOrder!3", 
      ":", 
      "!icon/action_paste|
      !code/action_paste" ]},
      
      
      {type: base, spec: 'b', 
      attributes: { width: Custom1 },
      hint: " ", 
      moreKeys: [
      "!autoColumnOrder!5", 
      ";", ".", "\u0022", "•", "·"]},
      
      
      {type: base, spec: 'n', 
      attributes: { width: Custom1 },
      hint: " ", 
      moreKeys: [
      "!autoColumnOrder!5", 
      "!", "¡", "ⁿ", "№"]},
      
      
      {type: base, spec: 'm', 
      attributes: { width: Custom1 },
      hint: " ", 
      moreKeys: [
      "!autoColumnOrder!7", 
      "?", "¿", "‽",  
      "μ", "♪", "[]()", 
      =, ≠, ≈, ∞, 
      +, ±, ×, ÷]}
    ]
  
  - bottom: 
      
      - { type: symbols, 
      attributes: { width: Custom1 }}
      
      - { type: shift, 
      attributes: { width: Custom1 }}
      
      - $action
      
      - $space
      
      - $enter
      
      - { type: delete }